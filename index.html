<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контрольная работа: Тест по C#</title>
    <!-- Подключение Bootstrap и шрифтов -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Встроенный CSS -->
    <style>
        /* =========================================
           Переменные и базовые настройки
           ========================================= */
        :root {
            --grad-1: #6366f1;
            --grad-2: #8b5cf6;
            --grad-3: #ec4899;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
        code, .mono { font-family: 'JetBrains Mono', monospace; }

        /* =========================================
           Фон и анимация
           ========================================= */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; margin: 0; transition: background .4s;
        }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%;
            filter: blur(80px); opacity: .5; z-index: 0;
            pointer-events: none; animation: float 12s ease-in-out infinite;
        }
        body::before { width: 400px; height: 400px; background: #f093fb; top: -100px; left: -100px; }
        body::after { width: 500px; height: 500px; background: #4facfe; bottom: -150px; right: -150px; animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        /* =========================================
           Основная карточка (Стеклянный эффект)
           ========================================= */
        .app-shell { position: relative; z-index: 1; width: 100%; max-width: 820px; }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        /* =========================================
           Тёмная тема
           ========================================= */
        [data-bs-theme="dark"] {
            --glass-bg: rgba(30, 30, 45, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        [data-bs-theme="dark"] body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%); }
        [data-bs-theme="dark"] .app-header { border-color: rgba(255,255,255,.08); }
        [data-bs-theme="dark"] .theme-toggle { background: rgba(255,255,255,.1); color: #fff; }
        [data-bs-theme="dark"] .info-pill { background: rgba(99,102,241,.2); color: #a5b4fc; }
        [data-bs-theme="dark"] .chip { background: rgba(99,102,241,.2); color: #a5b4fc; }
        [data-bs-theme="dark"] .progress { background: rgba(255,255,255,.08); }
        [data-bs-theme="dark"] .question-text { color: #f1f5f9; }
        [data-bs-theme="dark"] .option-btn { border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.03); color: #e2e8f0; }
        [data-bs-theme="dark"] .option-btn .letter { background: rgba(255,255,255,.08); }
        [data-bs-theme="dark"] .btn-ghost { border-color: rgba(255,255,255,.15); color: #e2e8f0; }
        [data-bs-theme="dark"] .stat-box { background: rgba(255,255,255,.05); }
        [data-bs-theme="dark"] .app-footer { color: rgba(255,255,255,.4); }

        /* =========================================
           Шапка приложения
           ========================================= */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.25rem 1.75rem; border-bottom: 1px solid rgba(0,0,0,.06);
        }
        .logo {
            display: flex; align-items: center; gap: .65rem;
            font-weight: 800; font-size: 1.15rem;
            background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo i {
            background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }
        .theme-toggle {
            border: none; background: rgba(0,0,0,.05);
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all .2s; font-size: 1.1rem;
        }
        .theme-toggle:hover { transform: scale(1.08); background: rgba(0,0,0,.1); }

        /* =========================================
           Контент и анимации экранов
           ========================================= */
        .content { padding: 2.25rem 1.75rem 2rem; }
        .screen { animation: fadeUp .5s ease both; }
        .screen.d-none { display: none !important; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           Стартовый экран
           ========================================= */
        .hero-title {
            font-weight: 800; font-size: 2rem; letter-spacing: -.02em;
            background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .info-pills { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin: 1.5rem 0; }
        .info-pill {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .5rem 1rem; background: rgba(99,102,241,.1);
            color: #6366f1; border-radius: 100px; font-size: .85rem; font-weight: 600;
        }

        /* =========================================
           Кнопки
           ========================================= */
        .btn-grad {
            background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            background-size: 200% auto; color: #fff; border: none;
            border-radius: 14px; padding: .8rem 2rem; font-weight: 600;
            transition: all .3s; box-shadow: 0 10px 25px -8px rgba(139, 92, 246, .6);
        }
        .btn-grad:hover { background-position: right center; color: #fff; transform: translateY(-2px); box-shadow: 0 15px 30px -8px rgba(236, 72, 153, .7); }
        .btn-ghost {
            background: transparent; border: 2px solid rgba(0,0,0,.1);
            border-radius: 14px; padding: .6rem 1.4rem; font-weight: 600; transition: all .2s;
        }
        .btn-ghost:hover:not(:disabled) { border-color: var(--grad-1); color: var(--grad-1); }
        .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }

        /* =========================================
           Прогресс-бар и чипы
           ========================================= */
        .progress-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; }
        .chip {
            display: inline-flex; align-items: center; gap: .35rem;
            background: rgba(99,102,241,.1); color: #6366f1;
            padding: .35rem .85rem; border-radius: 100px; font-size: .82rem; font-weight: 600;
        }
        .chip.success { background: rgba(16,185,129,.15); color: #059669; }
        .progress { height: 10px; border-radius: 100px; background: rgba(0,0,0,.06); overflow: hidden; margin-bottom: 1.75rem; }
        .progress-bar { background: linear-gradient(90deg, var(--grad-1), var(--grad-3)); border-radius: 100px; transition: width .5s; }

        /* =========================================
           Вопросы и варианты ответов
           ========================================= */
        .question-text { font-size: 1.25rem; font-weight: 700; line-height: 1.5; margin-bottom: 1.5rem; color: #1e293b; }
        .option-btn {
            display: flex; align-items: center; gap: 1rem; width: 100%; text-align: left;
            padding: 1rem 1.25rem; border-radius: 16px; border: 2px solid rgba(0,0,0,.08);
            background: rgba(255,255,255,.5); color: #334155; font-weight: 500;
            transition: all .2s; cursor: pointer; margin-bottom: .75rem;
        }
        .option-btn:hover { border-color: var(--grad-1); transform: translateX(4px); background: rgba(99,102,241,.06); }
        .option-btn .letter {
            flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
            background: rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .9rem;
        }
        .option-btn.selected {
            border-color: transparent; background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            color: #fff; box-shadow: 0 10px 25px -8px rgba(139,92,246,.5);
        }
        .option-btn.selected .letter { background: rgba(255,255,255,.25); color: #fff; }

        /* =========================================
           Экран результатов
           ========================================= */
        .score-circle {
            width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            background: conic-gradient(var(--grad-1) 0%, var(--grad-3) var(--pct, 0%), rgba(0,0,0,.08) var(--pct, 0%));
            position: relative;
        }
        .score-circle::before { content: ''; position: absolute; inset: 12px; background: var(--glass-bg); border-radius: 50%; backdrop-filter: blur(10px); }
        .score-circle .inner { position: relative; z-index: 1; text-align: center; }
        .score-circle .big {
            font-size: 2.8rem; font-weight: 800;
            background: linear-gradient(135deg, var(--grad-1), var(--grad-3));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1;
        }
        .score-circle .small { font-size: .85rem; color: #64748b; font-weight: 500; margin-top: .25rem; }
        .result-msg { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; color: #334155; }
        [data-bs-theme="dark"] .result-msg { color: #e2e8f0; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
        .stat-box { padding: 1rem .5rem; border-radius: 16px; background: rgba(0,0,0,.04); text-align: center; }
        .stat-box .val { font-size: 1.5rem; font-weight: 800; }
        .stat-box .lbl { font-size: .75rem; color: #64748b; text-transform: uppercase; }
        .stat-box.ok .val { color: #10b981; }
        .stat-box.bad .val { color: #ef4444; }

        /* =========================================
           Подвал и адаптивность
           ========================================= */
        .app-footer { text-align: center; padding: 1rem; font-size: .8rem; color: rgba(0,0,0,.5); }
        @media (max-width: 576px) {
            .content { padding: 1.5rem 1.25rem; }
            .hero-title { font-size: 1.6rem; }
            .app-header { padding: 1rem 1.25rem; }
            .question-text { font-size: 1.1rem; }
            .score-circle { width: 150px; height: 150px; }
            .score-circle .big { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="glass">
        <div class="app-header">
            <div class="logo"><i class="bi bi-braces"></i><span>QuizC#</span></div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">
                <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>
        </div>

        <div class="content">
            <!-- Стартовый экран -->
            <div id="start-screen" class="screen text-center">
                <!-- Задание 2: Картинка с обязательным атрибутом alt -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Logo_of_C_Sharp.svg/1200px-Logo_of_C_Sharp.svg.png" 
                     alt="Официальный логотип языка программирования C#" 
                     width="100" class="mb-3 img-fluid">
                     
                <h1 class="hero-title mb-3">Тест по основам C#</h1>
                <p class="text-secondary mb-0" style="max-width:520px;margin:0 auto;">
                    Проверьте свои знания языка C#. Вопросы загружаются автоматически из базы знаний.
                </p>
                <div class="info-pills">
                    <span class="info-pill"><i class="bi bi-cloud-arrow-down"></i> Загрузка из Google Sheets</span>
                    <span class="info-pill"><i class="bi bi-award"></i> Мгновенный результат</span>
                </div>
                <!-- Кнопка, которая меняет текст на странице -->
                <button class="btn btn-grad btn-lg mt-4" onclick="loadAndStartQuiz()" id="startBtn">
                    <i class="bi bi-play-fill me-1"></i> Начать тест
                </button>
            </div>

            <!-- Экран загрузки -->
            <div id="loading-screen" class="screen d-none text-center py-5">
                <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                <h4 class="mb-2">Загрузка вопросов...</h4>
                <p class="text-muted small">Подключаемся к Google Таблицам</p>
            </div>

            <!-- Экран теста -->
            <div id="quiz-screen" class="screen d-none">
                <div class="progress-wrap">
                    <span class="chip"><i class="bi bi-question-circle"></i> <span id="current-num">1</span> / <span id="total-num">10</span></span>
                    <span class="chip success"><i class="bi bi-check2-circle"></i> Правильно: <span id="score-live">0</span></span>
                </div>
                <div class="progress">
                    <div id="progress-bar" class="progress-bar" style="width:0%"></div>
                </div>
                <div class="question-text" id="question-text"></div>
                <div id="options"></div>
                <div class="d-flex justify-content-between mt-4">
                    <button class="btn btn-ghost" onclick="prevQuestion()" id="prev-btn"><i class="bi bi-arrow-left"></i> Назад</button>
                    <button class="btn btn-grad" onclick="nextQuestion()" id="next-btn">Далее <i class="bi bi-arrow-right"></i></button>
                </div>
            </div>

            <!-- Экран результатов -->
            <div id="result-screen" class="screen d-none text-center">
                <div class="score-circle" id="score-circle">
                    <div class="inner">
                        <div class="big" id="final-percent">0%</div>
                        <div class="small">результат</div>
                    </div>
                </div>
                <div class="result-msg" id="final-message"></div>
                <div class="stat-grid">
                    <div class="stat-box ok"><div class="val" id="stat-correct">0</div><div class="lbl">Верно</div></div>
                    <div class="stat-box bad"><div class="val" id="stat-wrong">0</div><div class="lbl">Неверно</div></div>
                    <div class="stat-box"><div class="val" id="stat-total">0</div><div class="lbl">Всего</div></div>
                </div>
                <button class="btn btn-grad mt-3" onclick="restartQuiz()"><i class="bi bi-arrow-clockwise me-1"></i> Пройти заново</button>
            </div>
        </div>
        <div class="app-footer"><i class="bi bi-code-slash"></i> ISRPO_KR · <span id="year"></span></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Ссылка на вашу опубликованную Google Таблицу
    const PUBLISHED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlz1LDoyZ6YnuDVVLCX3BieFhp-HFkfLWmWfAeTRpByfxsXmKkIQufZYTunhpj3_98PvnV2y_cNmtg/pubhtml";

    // Встроенные вопросы на случай, если таблица не загрузится
    const FALLBACK_QUESTIONS = [
        { q: "Какой тип данных в C# используется для хранения целых чисел?", options: ["int", "float", "string", "bool"], answer: 0 },
        { q: "Какое ключевое слово используется для объявления константы?", options: ["static", "readonly", "const", "final"], answer: 2 }
    ];

    let questions = [];
    const letters = ['A', 'B', 'C', 'D'];
    let current = 0;
    let answers = [];

    const startScreen = document.getElementById('start-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    document.getElementById('year').textContent = new Date().getFullYear();

    const storage = {
        get: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
        set: (key, val) => { try { localStorage.setItem(key, val); } catch(e) {} }
    };

    async function loadAndStartQuiz() {
        // Задание 2: Вывод в консоль по нажатию на кнопку
        console.log("Кнопка нажата");
        
        startScreen.classList.add('d-none');
        loadingScreen.classList.remove('d-none');
        
        try {
            // исправлено: ИИ дал код для обычной ссылки на CSV, но Google Таблицы при публикации (pubhtml) 
            // не отдают CSV напрямую. Добавил замену ссылки на формат /pub?output=csv
            const csvUrl = PUBLISHED_URL.replace('/pubhtml', '/pub?output=csv');

            const response = await fetch(csvUrl);
            
            // исправлено: ИИ не добавил проверку на статус ответа (200 OK). Если ссылка битая, fetch вернет 404, 
            // но программа попытается парсить пустоту. Добавил вручную.
            if (!response.ok) throw new Error("Ошибка сети: не удалось скачать таблицу");
            
            const csvText = await response.text();
            
            // исправлено: ИИ не учел, что при закрытом доступе Google возвращает HTML страницу логина вместо CSV. 
            // Добавил проверку, чтобы программа не "ломалась".
            if (csvText.includes("<!DOCTYPE html>") || csvText.includes("<html")) {
                throw new Error("Google вернул HTML вместо CSV. Проверьте доступ к таблице.");
            }
            
            questions = parseCSV(csvText);
            
            if (questions.length === 0) throw new Error("В таблице нет вопросов.");
            
            loadingScreen.classList.add('d-none');
            startQuiz();
            
        // исправлено: ИИ не обернул fetch в try-catch, из-за чего при потере интернета страница просто зависала в загрузке.
        // Добавил блок catch и понятное сообщение (alert) для пользователя.
        } catch (error) {
            console.error("Ошибка загрузки:", error);
            alert("Ошибка: " + error.message + "\n\nБудут загружены встроенные вопросы.");
            questions = FALLBACK_QUESTIONS;
            loadingScreen.classList.add('d-none');
            startQuiz();
        }
    }

    function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    currentCell += '"'; i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                currentRow.push(currentCell); currentCell = '';
            } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++;
                currentRow.push(currentCell);
                if (currentRow.some(cell => cell.trim() !== '')) {
                    rows.push(currentRow);
                }
                currentRow = []; currentCell = '';
            } else {
                currentCell += char;
            }
        }
        if (currentCell !== '' || currentRow.length > 0) {
            currentRow.push(currentCell); rows.push(currentRow);
        }

        const parsedQuestions = [];
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 7) continue;

            const [n, theme, opt1, opt2, opt3, opt4, correctNumStr] = row.map(cell => cell.trim());
            const correctNum = parseInt(correctNumStr, 10);
            
            if (isNaN(correctNum) || correctNum < 1 || correctNum > 4) continue;

            const questionText = `<span class="badge bg-secondary mb-2" style="font-size: 0.7em;">${theme}</span><br>${n}`;

            parsedQuestions.push({
                q: questionText,
                options: [opt1, opt2, opt3, opt4],
                answer: correctNum - 1
            });
        }
        return parsedQuestions;
    }

    function startQuiz() {
        current = 0;
        answers = new Array(questions.length).fill(-1);
        startScreen.classList.add('d-none');
        resultScreen.classList.add('d-none');
        loadingScreen.classList.add('d-none');
        quizScreen.classList.remove('d-none');
        document.getElementById('total-num').textContent = questions.length;
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[current];
        document.getElementById('current-num').textContent = current + 1;
        document.getElementById('question-text').innerHTML = q.q;

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
            btn.onclick = () => selectOption(i);
            optionsDiv.appendChild(btn);
        });

        highlightSelection();
        document.getElementById('progress-bar').style.width = ((current / questions.length) * 100) + '%';
        document.getElementById('prev-btn').disabled = current === 0;
        document.getElementById('next-btn').innerHTML = current === questions.length - 1
            ? 'Завершить <i class="bi bi-check2-circle"></i>'
            : 'Далее <i class="bi bi-arrow-right"></i>';
        updateLiveScore();
    }

    function selectOption(index) {
        answers[current] = index;
        highlightSelection();
        updateLiveScore();
    }

    function highlightSelection() {
        document.querySelectorAll('#options .option-btn').forEach((btn, i) => {
            btn.classList.toggle('selected', answers[current] === i);
        });
    }

    function updateLiveScore() {
        const score = answers.reduce((acc, a, i) => acc + (a === questions[i].answer ? 1 : 0), 0);
        document.getElementById('score-live').textContent = score;
    }

    function nextQuestion() {
        if (current < questions.length - 1) {
            current++; renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function prevQuestion() {
        if (current > 0) { current--; renderQuestion(); }
    }

    function finishQuiz() {
        quizScreen.classList.add('d-none');
        resultScreen.classList.remove('d-none');
        const score = answers.reduce((acc, a, i) => acc + (a === questions[i].answer ? 1 : 0), 0);
        const percent = Math.round((score / questions.length) * 100);

        animateNumber(document.getElementById('final-percent'), 0, percent, 800, '%');
        document.getElementById('score-circle').style.setProperty('--pct', percent + '%');
        document.getElementById('stat-correct').textContent = score;
        document.getElementById('stat-wrong').textContent = questions.length - score;
        document.getElementById('stat-total').textContent = questions.length;

        let msg = '', icon = '';
        if (percent >= 90) { msg = 'Превосходно! Вы отлично знаете C#.'; icon = '🏆'; }
        else if (percent >= 70) { msg = 'Отличный результат!'; icon = '🎉'; }
        else if (percent >= 50) { msg = 'Неплохо, но стоит повторить материал.'; icon = '👍'; }
        else { msg = 'Стоит серьёзно повторить основы C#.'; icon = '💪'; }
        document.getElementById('final-message').textContent = icon + ' ' + msg;
    }

    function animateNumber(el, from, to, duration, suffix = '') {
        const start = performance.now();
        function step(now) {
            const t = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = Math.round(from + (to - from) * eased) + suffix;
            if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function restartQuiz() {
        startScreen.classList.remove('d-none');
        resultScreen.classList.add('d-none');
    }

    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-bs-theme') === 'dark';
        html.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
        document.getElementById('themeIcon').className = isDark ? 'bi bi-moon-stars' : 'bi bi-sun';
        storage.set('quiz-theme', isDark ? 'light' : 'dark');
    }

    (function initTheme() {
        const saved = storage.get('quiz-theme');
        if (saved === 'dark') {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
            document.getElementById('themeIcon').className = 'bi bi-sun';
        }
    })();
</script>
</body>
</html>
